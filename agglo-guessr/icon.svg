<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Carré arrondi plein : fond de l'icône du widget dans la liste du builder (couleur dans fill) -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="#0f6b5c"/>
  <!-- Lettres AG centrées en blanc : seul élément de l'icône, aucun pictogramme -->
